name: AutoUpdate checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test package staging, rollback, and release packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\test_engine.ps1
          .\tests\test_packager.ps1
          .\tests\test_sync.ps1

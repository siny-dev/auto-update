name: AutoUpdate checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run complete AutoUpdate regression suite
        shell: powershell
        run: .\tools\test-all.ps1

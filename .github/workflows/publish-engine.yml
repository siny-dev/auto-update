name: Publish shared AutoUpdate engine
on:
  push:
    branches: [main]
    paths:
      - 'source/AutoUpdate.Core.psm1'
      - 'tools/autoupdate.ps1'
      - 'tools/restart-apply.ps1'
      - 'tools/build-engine-release.ps1'
      - 'contracts/**'
      - 'tools/new-release-package.ps1'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autoupdate-engine-release
  cancel-in-progress: false
jobs:
  package-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run complete AutoUpdate regression suite
        shell: powershell
        run: .\tools\test-all.ps1
      - name: Build immutable release assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $run = [int]$env:GITHUB_RUN_NUMBER
          $attempt = [int]$env:GITHUB_RUN_ATTEMPT
          $version = '0.1.' + ($run * 100 + $attempt)
          $root = Join-Path $env:RUNNER_TEMP 'autoupdate-engine-release'
          $output = Join-Path $root 'output'
          .\tools\build-engine-release.ps1 -Version $version -OutputRoot $output
          "ENGINE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENGINE_RELEASE_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish stable engine release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v' + $env:ENGINE_VERSION
          $files = @((Join-Path $env:ENGINE_RELEASE_OUTPUT 'autoupdate-manifest.json')) + @(Get-ChildItem (Join-Path $env:ENGINE_RELEASE_OUTPUT 'assets') -File | ForEach-Object FullName)
          gh release create $tag $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AutoUpdate engine $env:ENGINE_VERSION" --notes 'Verified shared updater runtime package.'

name: AutoUpdate validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          $files = @(Get-ChildItem -Path tools,tests -Recurse -File -Include *.ps1,*.psm1)
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error ($file.FullName + ': ' + $_.Message) }; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Run complete AutoUpdate regression suite
        shell: powershell
        run: .\tools\test-all.ps1
